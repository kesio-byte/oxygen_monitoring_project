{% extends "base.html" %}
{% block content %}
<div class="container mx-auto py-8 px-6">
    <h1 class="text-2xl font-bold text-blue-600 mb-6">Set New Password</h1>
    <form method="post" class="space-y-4 bg-white shadow rounded-lg p-6">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
            Change Password
        </button>
    </form>
</div>
{% endblock %}
