{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-8 px-6">
    <h1 class="text-2xl font-bold text-blue-600 mb-6">Login</h1>

    {% if form.errors %}
        <div class="mb-4 text-red-600">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="post" class="space-y-6 bg-white shadow rounded-lg p-6">
        {% csrf_token %}

        <!-- Username field -->
        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" name="username" id="id_username"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2"
                   placeholder="Enter your username" required>
        </div>

        <!-- Password field -->
        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" id="id_password"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2"
                   placeholder="Enter your password" required>
        </div>

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit"
                class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold">
            Login
        </button>
    </form>

    <p class="mt-4 text-gray-600">
        Forgot your password?
        <a href="{% url 'password_reset' %}" class="text-blue-600 hover:underline">Reset it here</a>.
    </p>
</div>
{% endblock %}
