{% extends "base.html" %}
{% block content %}
<div class="container mx-auto py-8 px-6">
    <h1 class="text-2xl font-bold text-blue-600 mb-6">Reset Password</h1>
    <p class="mb-4 text-gray-600">Enter your email address and we’ll send you instructions to reset your password.</p>
    <form method="post" class="space-y-4 bg-white shadow rounded-lg p-6">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
