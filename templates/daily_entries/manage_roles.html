{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-8 px-6">
    <h1 class="text-2xl font-bold text-blue-600 mb-6">
        Manage Roles for {{ user.username }}
    </h1>

    <form method="post" class="bg-white shadow rounded-lg p-6 space-y-4">
        {% csrf_token %}

        <div class="space-y-3">
            <label class="block text-sm font-medium text-gray-700">Assign Roles:</label>
            {% for group in groups %}
                <div class="flex items-center space-x-3">
                    <input type="checkbox" name="roles" value="{{ group.id }}"
                           {% if group in user.groups.all %}checked{% endif %}
                           class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">

                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-semibold
                        {% if group.name == 'Admin' %}
                            bg-red-100 text-red-700
                        {% elif group.name == 'Technician' %}
                            bg-yellow-100 text-yellow-700
                        {% elif group.name == 'Viewer' %}
                            bg-green-100 text-green-700
                        {% else %}
                            bg-gray-100 text-gray-700
                        {% endif %}
                    ">
                        {{ group.name }}
                    </span>
                </div>
            {% endfor %}
        </div>

        <div class="flex space-x-4">
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700">
                Save Changes
            </button>
            <a href="{% url 'users_list' %}"
               class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded hover:bg-gray-300">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
